<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر استخر دانش کرج</title>
    <meta name="description" content="تصاویر و ویدیوهای استخر دانش کرج.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; direction: rtl; }
        body { font-family: 'Tahoma', Arial, sans-serif; background: #f4fbfd; color: #38566a; line-height: 1.6; }
        .container { width: min(calc(100% - 48px), 1240px); margin: 0 auto; }
        header { background: white; padding: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .site-header__inner { display: flex; align-items: center; gap: 20px; justify-content: space-between; }
        .site-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #092f46; font-weight: bold; }
        .site-logo__mark { width: 40px; height: 40px; background: linear-gradient(145deg, #087ea4, #045d7b); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        nav a { color: #092f46; text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; font-size: 14px; font-weight: bold; }
        nav a:hover { background: #dff7fa; color: #087ea4; }
        main { padding: 100px 0; }
        section { padding: 50px 0; }
        h1 { color: #092f46; font-size: 42px; margin-bottom: 20px; }
        p { color: #38566a; margin-bottom: 15px; }
        .button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; transition: all 0.3s; }
        .button--primary { background: #087ea4; color: white; }
        .button--primary:hover { background: #045d7b; transform: translateY(-2px); }
        .button--secondary { background: white; color: #087ea4; border: 2px solid #087ea4; }
        .button--secondary:hover { background: #dff7fa; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content" style="position: fixed; top: 10px; right: 10px; background: #092f46; color: white; padding: 10px; text-decoration: none; border-radius: 4px; z-index: 9999;">
        رفتن به محتوای اصلی
    </a>
    <header class="site-header" id="site-header">
        <div class="container site-header__inner">
            <a class="site-logo" href="../" aria-label="صفحه اصلی">
                <span class="site-logo__mark" aria-hidden="true">د</span>
                <span><strong>استخر دانش</strong></span>
            </a>
            <nav>
                <a href="../">خانه</a>
                <a href="../about/">درباره ما</a>
                <a href="../facilities/">امکانات</a>
                <a href="../classes/">آموزش شنا</a>
                <a href="../coaches/">مربیان</a>
                <a href="../schedule/">سانس‌ها</a>
                <a href="../pricing/">تعرفه‌ها</a>
                <a href="../gallery/">گالری</a>
                <a href="../blog/">وبلاگ</a>
                <a href="../contact/">تماس</a>
            </nav>
        </div>
    </header>
    <main id="main-content">
        <section>
            <div class="container">
                <h1>گالری تصاویر</h1>
                <p>گالری تصاویر در حال توسعه است. به زودی تصاویر جدید اضافه خواهد شد.</p>
                <p style="margin-top: 20px;">
                    <a href="../" class="button button--primary">صفحه اصلی</a>
                    <a href="../facilities/" class="button button--secondary" style="margin-right: 10px;">امکانات</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
